<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tea Shop Account</title>
<style>
  :root{
    --tea:#7B3F00;
    --tea-dark:#5C2E00;
    --cream:#FFF6EA;
    --card:#FFFFFF;
    --ink:#2B1A0E;
    --muted:#8A7361;
    --red:#C62828;
    --red-bg:#FDECEA;
    --green:#2E7D32;
    --green-bg:#E8F5E9;
    --line:#EFDFC9;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--cream);color:var(--ink);
    max-width:520px;margin:0 auto;min-height:100vh;
    padding-bottom:100px;
  }
  header{
    background:var(--tea);color:#fff;
    padding:16px 16px 14px;
    border-radius:0 0 22px 22px;
    text-align:center;
  }
  header h1{font-size:22px;font-weight:800;letter-spacing:.3px}
  header .cup{font-size:26px;margin-right:6px}
  .shop-banner{
    display:inline-flex;align-items:center;gap:8px;margin-top:8px;
    background:rgba(255,255,255,.16);
    border:1.5px solid rgba(255,255,255,.35);
    border-radius:999px;padding:4px 16px 4px 5px;
    font-size:14.5px;font-weight:800;letter-spacing:.3px;
  }
  .banner-logo{
    width:30px;height:30px;border-radius:50%;
    object-fit:cover;display:block;
  }
  .lock-logo{
    width:110px;height:110px;border-radius:24px;
    object-fit:cover;margin-bottom:12px;
    box-shadow:0 6px 20px rgba(0,0,0,.35);
  }
  .total-bar{display:flex;justify-content:center;gap:12px;margin-top:12px}
  .total-box{
    background:rgba(255,255,255,.14);border-radius:14px;
    padding:8px 14px;text-align:center;min-width:105px;
  }
  .total-box .amt{font-size:22px;font-weight:800}
  .total-box .lbl{font-size:11.5px;opacity:.9;margin-top:2px}
  .grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
    padding:16px 14px;
  }
  .cust{
    background:var(--card);border-radius:18px;
    padding:12px 6px 10px;text-align:center;
    border:2px solid var(--line);cursor:pointer;
    transition:transform .1s ease;position:relative;
  }
  .cust:active{transform:scale(.94)}
  .cust.danger{border-color:var(--red)}
  .cust.danger::after{content:"⚠️";position:absolute;top:6px;right:8px;font-size:14px}
  .cust.advance{border-color:#BFE3C2}
  .avatar{
    width:56px;height:56px;border-radius:50%;
    margin:0 auto 7px;
    display:flex;align-items:center;justify-content:center;
    font-size:24px;font-weight:800;color:#fff;
  }
  .cname{
    font-size:12.5px;font-weight:700;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin-bottom:3px;padding:0 2px;
  }
  .owed{font-size:18px;font-weight:800;color:var(--red)}
  .owed.zero{color:var(--green)}
  .owed.adv{color:var(--green)}
  .days{font-size:10.5px;color:var(--muted);margin-top:2px}
  .cust.addnew{
    border-style:dashed;border-color:#C9B392;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:132px;color:var(--tea);
  }
  .cust.addnew .plus{font-size:34px;font-weight:800;line-height:1}
  .cust.addnew .txt{font-size:13px;font-weight:700;margin-top:6px}
  .loading-box{
    grid-column:span 3;text-align:center;color:var(--muted);
    padding:50px 20px;font-size:15px;
  }
  .overlay{display:none;position:fixed;inset:0;background:rgba(43,26,14,.55);z-index:10}
  .overlay.show{display:block}
  .sheet{
    position:fixed;bottom:0;left:50%;transform:translate(-50%,105%);
    width:100%;max-width:520px;background:#fff;z-index:11;
    border-radius:26px 26px 0 0;padding:20px 18px 26px;
    transition:transform .25s ease;text-align:center;
    max-height:88vh;overflow-y:auto;
  }
  .sheet.show{transform:translate(-50%,0)}
  .sheet .avatar{width:74px;height:74px;font-size:32px}
  .sheet .cust-name{font-size:18px;font-weight:800;margin-top:8px}
  .sheet .bal{font-size:32px;font-weight:800;color:var(--red);margin-top:4px}
  .sheet .bal.zero{color:var(--green)}
  .sheet .bal.adv{color:var(--green)}
  .sheet .bal-lbl{font-size:13px;color:var(--muted);margin-bottom:12px}
  .section-lbl{font-size:14px;font-weight:800;margin:10px 0 8px}
  .btn-row{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:6px}
  .tea-btn{
    background:var(--red-bg);color:var(--red);
    border:2px solid #F5C6C0;border-radius:14px;
    padding:14px 2px;font-size:15.5px;font-weight:800;cursor:pointer;font-family:inherit;
  }
  .tea-btn:active{background:#F9D7D3}
  .pay-btn{
    background:var(--green-bg);color:var(--green);
    border:2px solid #BFE3C2;border-radius:14px;
    padding:14px 2px;font-size:15.5px;font-weight:800;cursor:pointer;font-family:inherit;
  }
  .pay-btn:active{background:#D4EED6}
  .full-pay{grid-column:span 5;font-size:16px;padding:14px 4px}
  .history-btn{
    width:100%;margin-top:10px;
    background:#F7EFE2;color:var(--tea);
    border:2px solid var(--line);border-radius:14px;
    padding:13px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;
  }
  .history-btn:active{background:#EFE2CC}
  .close-btn{
    width:100%;background:none;border:none;color:var(--muted);
    padding:14px 12px 2px;font-size:15px;cursor:pointer;font-family:inherit;font-weight:700;
  }
  .remove-btn{
    background:none;border:none;color:#B99;font-size:12.5px;
    margin-top:8px;cursor:pointer;font-family:inherit;text-decoration:underline;
  }
  /* ---------- Add customer form ---------- */
  .field{margin-bottom:13px;text-align:left}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:5px}
  .field input{
    width:100%;padding:13px 12px;border:2px solid var(--line);
    border-radius:12px;font-size:16px;outline:none;background:#FBF7EF;
    font-family:inherit;
  }
  .field input:focus{border-color:var(--tea);background:#fff}
  .save-btn{
    width:100%;background:var(--tea);color:#fff;border:none;
    border-radius:14px;padding:15px;font-size:17px;font-weight:800;
    cursor:pointer;font-family:inherit;
  }
  .save-btn:active{background:var(--tea-dark)}
  .save-btn:disabled{opacity:.45}
  /* ---------- Number pad ---------- */
  .pad-display{font-size:40px;font-weight:800;margin:8px 0 14px;min-height:52px}
  .pad-display.credit{color:var(--red)}
  .pad-display.pay{color:var(--green)}
  .pad-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:9px;
    max-width:290px;margin:0 auto;
  }
  .pad-key{
    background:#F7EFE2;border:2px solid var(--line);border-radius:16px;
    padding:16px 0;font-size:22px;font-weight:800;cursor:pointer;font-family:inherit;
    color:var(--ink);
  }
  .pad-key:active{background:#EFE2CC}
  .pad-ok{
    width:100%;max-width:290px;margin:14px auto 0;display:block;
    border:none;border-radius:16px;padding:16px;font-size:17px;font-weight:800;
    cursor:pointer;font-family:inherit;color:#fff;
  }
  .pad-ok.credit{background:var(--red)}
  .pad-ok.pay{background:var(--green)}
  .pad-ok:disabled{opacity:.4}
  /* ---------- Voice note prompt ---------- */
  .mic-circle{
    width:96px;height:96px;border-radius:50%;margin:10px auto 12px;
    display:flex;align-items:center;justify-content:center;
    font-size:42px;cursor:pointer;
    background:var(--red-bg);border:3px solid #F5C6C0;
  }
  .mic-circle.recording{
    background:var(--red);border-color:var(--red);
    animation:pulse 1s infinite;
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(198,40,40,.45)}
    50%{box-shadow:0 0 0 16px rgba(198,40,40,0)}
  }
  .rec-timer{font-size:15px;font-weight:800;color:var(--red);min-height:22px;margin-bottom:8px}
  .voice-actions{display:flex;gap:9px;margin-top:10px}
  .voice-actions button{
    flex:1;border-radius:14px;padding:14px 4px;font-size:15px;font-weight:800;
    cursor:pointer;font-family:inherit;border:none;
  }
  .v-save{background:var(--green);color:#fff}
  .v-skip{background:#F1E9DB;color:var(--muted)}
  .v-save:disabled{opacity:.4}
  /* ---------- History list ---------- */
  .hist-list{text-align:left;margin-top:6px}
  .hist-item{
    display:flex;align-items:center;gap:10px;
    padding:11px 6px;border-bottom:1.5px solid var(--line);
  }
  .hist-date{font-size:12px;color:var(--muted);width:82px;flex-shrink:0}
  .hist-amt{flex:1;font-size:16px;font-weight:800}
  .hist-amt.credit{color:var(--red)}
  .hist-amt.pay{color:var(--green)}
  .hist-play{
    width:44px;height:44px;border-radius:50%;border:none;
    background:var(--tea);color:#fff;font-size:17px;cursor:pointer;
    flex-shrink:0;
  }
  .hist-play:disabled{opacity:.5}
  .hist-empty{color:var(--muted);font-size:14px;padding:26px 0}
  /* ---------- PIN lock screen ---------- */
  .lock{
    position:fixed;inset:0;z-index:50;
    background:var(--tea);color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:20px;
    max-width:520px;margin:0 auto;
  }
  .lock.hidden{display:none}
  .lock .big-cup{font-size:52px;margin-bottom:8px}
  .lock h2{font-size:22px;font-weight:800}
  .lock .shopname{
    margin-top:8px;background:rgba(255,255,255,.16);
    border:1.5px solid rgba(255,255,255,.35);
    border-radius:999px;padding:6px 18px;
    font-size:15px;font-weight:800;
  }
  .lock .hint{font-size:13.5px;opacity:.85;margin:18px 0 14px}
  .pin-dots{display:flex;gap:16px;margin-bottom:22px}
  .dot{
    width:16px;height:16px;border-radius:50%;
    border:2.5px solid rgba(255,255,255,.7);background:transparent;
    transition:background .1s;
  }
  .dot.on{background:#fff;border-color:#fff}
  .pin-dots.shake{animation:shake .4s}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-9px)}
    40%{transform:translateX(9px)}
    60%{transform:translateX(-6px)}
    80%{transform:translateX(6px)}
  }
  .lock .pad-grid .pad-key{
    background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff;
  }
  .lock .pad-key:active{background:rgba(255,255,255,.28)}
  .lock .err-msg{height:20px;font-size:14px;font-weight:700;color:#FFD3D3;margin-top:14px}
  .toast{
    position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-90px);
    background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;
    font-size:15px;font-weight:700;z-index:60;transition:transform .25s ease;
    white-space:nowrap;
  }
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast.err{background:var(--red)}
</style>
</head>

  <h2>Tea Shop Account</h2>
  <div class="shopname" id="lockShopName"></div>
  <div class="hint">Enter your secret PIN</div>
  <div class="pin-dots" id="pinDots">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>

<script>
// ==================================================================
// ⭐ SETTINGS — the only two lines you change per shop ⭐
// ==================================================================
const API_URL   = "https://script.google.com/macros/s/AKfycbwCIxM6c68PO0AUOqiDJvC6AupRg26TQmpINT81Kfawdkd_gwXItcKB6IbExl8PII0A/exec";
const SHOP_NAME = "AVS Tea Shop";   // ← change if the shop name is different

let customers = [];
let current = -1;
let shopPin = "";
const DANGER = 200;

document.getElementById("shopBanner").textContent = SHOP_NAME;
document.getElementById("lockShopName").textContent = SHOP_NAME;

// Colors for the letter circles (picked by name, stays same every time)
const AVATAR_COLORS = ["#C0632F","#2E7D5B","#8E44AD","#2563A8","#C2185B","#00838F","#E65100","#5D4037"];
function avatarColor(name){
  let sum = 0;
  for (let i = 0; i < name.length; i++) sum += name.charCodeAt(i);
  return AVATAR_COLORS[sum % AVATAR_COLORS.length];
}
function initialOf(name){
  return (name || "?").trim().charAt(0).toUpperCase();
}

// ==================================================================
// PIN lock screen
// ==================================================================
let pinEntry = "";
let pinBusy = false;

function pinPress(d){
  if (pinBusy || pinEntry.length >= 4) return;
  pinEntry += d;
  drawDots();
  if (pinEntry.length === 4) tryPin();
}
function pinBack(){
  if (pinBusy) return;
  pinEntry = pinEntry.slice(0,-1);
  drawDots();
  document.getElementById("pinErr").textContent = "";
}
function drawDots(){
  const dots = document.querySelectorAll("#pinDots .dot");
  dots.forEach((dot,i) => dot.classList.toggle("on", i < pinEntry.length));
}
async function tryPin(){
  pinBusy = true;
  document.getElementById("pinErr").textContent = "⏳ Checking…";
  try{
    const res = await fetch(API_URL + "?pin=" + encodeURIComponent(pinEntry));
    const data = await res.json();
    if (data.ok){
      shopPin = pinEntry;
      customers = data.customers || [];
      document.getElementById("lock").classList.add("hidden");
      render();
    } else {
      wrongPin();
    }
  }catch(err){
    document.getElementById("pinErr").textContent = "😕 No connection — check internet";
    pinEntry = ""; drawDots();
  }
  pinBusy = false;
}
function wrongPin(){
  const dotsBox = document.getElementById("pinDots");
  dotsBox.classList.add("shake");
  setTimeout(() => dotsBox.classList.remove("shake"), 450);
  document.getElementById("pinErr").textContent = "❌ Wrong PIN — try again";
  pinEntry = "";
  drawDots();
}

// ==================================================================
// Talk to the backend
// ==================================================================
function post(payload){
  payload.pin = shopPin;
  return fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  })
  .then(r => r.json())
  .catch(() => {
    toast("😕 Could not save — check internet", true);
    return { ok:false };
  });
}

function daysSince(iso){
  if (!iso) return 0;
  return Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 86400000));
}

// ==================================================================
// Render the grid
// ==================================================================
function render(){
  let totalOwed = 0, totalAdv = 0, people = 0;
  customers.forEach(c => {
    if (c.owed > 0){ totalOwed += c.owed; people++; }
    if (c.owed < 0){ totalAdv += Math.abs(c.owed); }
  });
  document.getElementById("totalOwed").textContent = "₹" + totalOwed;
  document.getElementById("totalAdvance").textContent = "₹" + totalAdv;
  document.getElementById("totalPeople").textContent = people;

  const order = customers.map((c,i)=>({c,i})).sort((a,b)=>b.c.owed - a.c.owed);

  const grid = document.getElementById("grid");
  grid.innerHTML = order.map(({c,i}) => {
    let cls = "", amtCls = "", amtTxt = "", dayTxt = "";
    if (c.owed > 0){
      cls = c.owed >= DANGER ? "danger" : "";
      amtTxt = "₹" + c.owed;
      dayTxt = daysSince(c.since) + " days";
    } else if (c.owed < 0){
      cls = "advance"; amtCls = "adv";
      amtTxt = "₹" + Math.abs(c.owed);
      dayTxt = "Advance";
    } else {
      amtCls = "zero"; amtTxt = "✔"; dayTxt = "No pending";
    }
    return `
    <div class="cust ${cls}" onclick="openCustomer(${i})">
      <div class="avatar" style="background:${avatarColor(c.name)}">${initialOf(c.name)}</div>
      <div class="cname">${c.name}</div>
      <div class="owed ${amtCls}">${amtTxt}</div>
      <div class="days">${dayTxt}</div>
    </div>`;
  }).join("")
  + `
    <div class="cust addnew" onclick="openAdd()">
      <div class="plus">＋</div>
      <div class="txt">New Person</div>
    </div>`;
}

// ==================================================================
// Customer sheet
// ==================================================================
function openCustomer(i){
  current = i;
  const c = customers[i];
  const av = document.getElementById("dAvatar");
  av.textContent = initialOf(c.name);
  av.style.background = avatarColor(c.name);
  document.getElementById("dName").textContent = c.name;
  updateBal();
  document.getElementById("overlay").classList.add("show");
  document.getElementById("custSheet").classList.add("show");
}

function updateBal(){
  const c = customers[current];
  const el = document.getElementById("dBal");
  const lbl = document.getElementById("dBalLbl");
  if (c.owed > 0){
    el.textContent = "₹" + c.owed;
    el.className = "bal";
    lbl.textContent = "Pending";
  } else if (c.owed < 0){
    el.textContent = "₹" + Math.abs(c.owed);
    el.className = "bal adv";
    lbl.textContent = "Advance balance";
  } else {
    el.textContent = "₹0";
    el.className = "bal zero";
    lbl.textContent = "No pending";
  }
}

// -------- credit + voice note flow --------
let lastCreditPromise = null;   // remembers the save that a voice note attaches to

function addCredit(amt){
  const c = customers[current];
  if (c.owed <= 0 && c.owed + amt > 0) c.since = new Date().toISOString();
  c.owed += amt;
  updateBal(); render();
  lastCreditPromise = post({ action:"credit", id:c.id, amt:amt });
  openVoicePrompt();            // "add a voice note?" appears right after
}

function payAmount(amt){
  const c = customers[current];
  c.owed -= amt;
  if (c.owed <= 0) c.since = "";
  updateBal(); render();
  if (c.owed < 0){
    toast("💵 Advance now ₹" + Math.abs(c.owed));
  } else {
    toast("💵 ₹" + amt + " received");
  }
  post({ action:"pay", id:c.id, amt:amt });
}

function payFull(){
  const c = customers[current];
  if (c.owed <= 0){ toast("Nothing pending"); return; }
  const amt = c.owed;
  c.owed = 0; c.since = "";
  updateBal(); render();
  toast("✔ ₹" + amt + " fully paid!");
  post({ action:"payfull", id:c.id });
}

function removeCustomer(){
  const c = customers[current];
  customers.splice(current,1);
  closeAll(); render();
  toast("Person removed");
  post({ action:"remove", id:c.id });
}

// ==================================================================
// Voice notes
// ==================================================================
let mediaRecorder = null;
let recChunks = [];
let recordedAudio = null;    // base64 data URL of the finished recording
let recTimerInt = null;
let recSeconds = 0;

function openVoicePrompt(){
  recordedAudio = null;
  document.getElementById("micBtn").classList.remove("recording");
  document.getElementById("micBtn").textContent = "🎤";
  document.getElementById("recTimer").textContent = "";
  document.getElementById("vSave").disabled = true;
  document.getElementById("custSheet").classList.remove("show");
  document.getElementById("voiceSheet").classList.add("show");
}

async function toggleRecord(){
  const btn = document.getElementById("micBtn");

  // ---- stop recording ----
  if (mediaRecorder && mediaRecorder.state === "recording"){
    mediaRecorder.stop();
    return;
  }

  // ---- start recording ----
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    const mime = MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "audio/mp4";
    mediaRecorder = new MediaRecorder(stream, { mimeType: mime });
    recChunks = [];

    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      clearInterval(recTimerInt);
      btn.classList.remove("recording");
      btn.textContent = "🎤";
      const blob = new Blob(recChunks, { type: mime });
      const reader = new FileReader();
      reader.onload = e => {
        recordedAudio = e.target.result;
        document.getElementById("recTimer").textContent = "✔ Recorded (" + recSeconds + " sec)";
        document.getElementById("vSave").disabled = false;
      };
      reader.readAsDataURL(blob);
    };

    mediaRecorder.start();
    btn.classList.add("recording");
    btn.textContent = "⏹";
    recSeconds = 0;
    document.getElementById("recTimer").textContent = "🔴 Speak… 0 sec";
    recTimerInt = setInterval(() => {
      recSeconds++;
      document.getElementById("recTimer").textContent = "🔴 Speak… " + recSeconds + " sec";
      if (recSeconds >= 30) mediaRecorder.stop();   // 30-second cap keeps files tiny
    }, 1000);

  }catch(err){
    toast("😕 Microphone permission needed — tap Allow", true);
  }
}

async function saveVoice(){
  const btn = document.getElementById("vSave");
  btn.disabled = true;
  btn.textContent = "Saving…";

  // Wait for the credit entry to finish saving so we know its row number
  const creditRes = await lastCreditPromise;

  if (creditRes && creditRes.ok && creditRes.logRow){
    const res = await post({ action:"voicenote", row:creditRes.logRow, audio:recordedAudio });
    btn.textContent = "Save";
    if (res.ok){
      toast("🎤 Voice note saved");
      closeVoicePrompt();
      return;
    }
  }
  btn.textContent = "Save";
  btn.disabled = false;
  toast("😕 Could not save — try again", true);
}

function skipVoice(){
  if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
  closeVoicePrompt();
}

function closeVoicePrompt(){
  document.getElementById("voiceSheet").classList.remove("show");
  document.getElementById("custSheet").classList.add("show");
  toast("☕ Entry added");
}

// ==================================================================
// History (with voice playback)
// ==================================================================
let playingAudio = null;

async function openHistory(){
  const c = customers[current];
  document.getElementById("histTitle").textContent = "📖 " + c.name + " — History";
  document.getElementById("histList").innerHTML = '<div class="hist-empty">⏳ Loading…</div>';
  document.getElementById("custSheet").classList.remove("show");
  document.getElementById("histSheet").classList.add("show");

  try{
    const res = await fetch(API_URL + "?pin=" + encodeURIComponent(shopPin) + "&history=" + encodeURIComponent(c.id));
    const data = await res.json();
    const list = document.getElementById("histList");

    if (!data.ok || !data.entries || data.entries.length === 0){
      list.innerHTML = '<div class="hist-empty">No entries yet</div>';
      return;
    }

    list.innerHTML = data.entries.map((en, idx) => {
      const d = en.time ? new Date(en.time) : null;
      const dateTxt = d ? (d.getDate() + "/" + (d.getMonth()+1) + " " +
        d.toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"})) : "";
      const isCredit = en.type === "CREDIT";
      const amtTxt = (isCredit ? "+₹" : "−₹") + en.amt +
        (isCredit ? " credit" : (en.type === "PAYMENT-FULL" ? " (full)" : " payment"));
      const playBtn = en.voice
        ? `<button class="hist-play" id="play${idx}" onclick="playVoice('${en.voice}','play${idx}')">▶</button>`
        : "";
      return `
      <div class="hist-item">
        <div class="hist-date">${dateTxt}</div>
        <div class="hist-amt ${isCredit ? 'credit' : 'pay'}">${amtTxt}</div>
        ${playBtn}
      </div>`;
    }).join("");

  }catch(err){
    document.getElementById("histList").innerHTML =
      '<div class="hist-empty">😕 No connection</div>';
  }
}

async function playVoice(fileId, btnId){
  const btn = document.getElementById(btnId);
  if (playingAudio){ playingAudio.pause(); playingAudio = null; }
  btn.disabled = true;
  btn.textContent = "⏳";
  try{
    const res = await fetch(API_URL + "?pin=" + encodeURIComponent(shopPin) + "&voice=" + encodeURIComponent(fileId));
    const data = await res.json();
    if (data.ok && data.audio){
      playingAudio = new Audio(data.audio);
      btn.textContent = "🔊";
      playingAudio.onended = () => { btn.textContent = "▶"; btn.disabled = false; };
      playingAudio.play();
    } else {
      throw new Error("no audio");
    }
  }catch(err){
    btn.textContent = "▶";
    btn.disabled = false;
    toast("😕 Voice not found", true);
  }
}

function closeHistory(){
  if (playingAudio){ playingAudio.pause(); playingAudio = null; }
  document.getElementById("histSheet").classList.remove("show");
  document.getElementById("custSheet").classList.add("show");
}

// ==================================================================
// Number pad — custom amounts
// ==================================================================
let padMode = "credit";
let padValue = 0;

function openPad(mode){
  padMode = mode;
  padValue = 0;
  const disp = document.getElementById("padDisplay");
  disp.textContent = "₹0";
  disp.className = "pad-display " + mode;
  document.getElementById("padTitle").textContent =
    mode === "credit" ? "☕ Other amount — Credit" : "💵 Other amount — Payment";
  const ok = document.getElementById("padOk");
  ok.className = "pad-ok " + mode;
  ok.disabled = true;
  document.getElementById("custSheet").classList.remove("show");
  document.getElementById("padSheet").classList.add("show");
}
function padPress(d){
  if (padValue >= 10000) return;
  padValue = padValue * 10 + d;
  padUpdate();
}
function padBack(){ padValue = Math.floor(padValue / 10); padUpdate(); }
function padClear(){ padValue = 0; padUpdate(); }
function padUpdate(){
  document.getElementById("padDisplay").textContent = "₹" + padValue;
  document.getElementById("padOk").disabled = (padValue === 0);
}
function padConfirm(){
  const amt = padValue;
  document.getElementById("padSheet").classList.remove("show");
  if (padMode === "credit"){
    addCredit(amt);           // voice prompt opens from inside addCredit
  } else {
    document.getElementById("custSheet").classList.add("show");
    payAmount(amt);
  }
}
function closePad(){
  document.getElementById("padSheet").classList.remove("show");
  document.getElementById("custSheet").classList.add("show");
}

// ==================================================================
// Add customer (name + optional phone)
// ==================================================================
function openAdd(){
  document.getElementById("fName").value = "";
  document.getElementById("fPhone").value = "";
  document.getElementById("overlay").classList.add("show");
  document.getElementById("addSheet").classList.add("show");
}

async function saveCustomer(){
  const name = document.getElementById("fName").value.trim();
  const phone = document.getElementById("fPhone").value.trim();
  if (!name){ toast("Name required", true); return; }

  const btn = document.getElementById("saveNew");
  btn.disabled = true;
  btn.textContent = "Saving…";

  const res = await post({ action:"add", name:name, phone:phone });

  btn.textContent = "Save";
  btn.disabled = false;

  if (res.ok && res.customer){
    customers.push(res.customer);
    closeAll(); render();
    toast("✔ " + name + " added");
  } else {
    toast("😕 Could not save — try again", true);
  }
}

// ==================================================================
// Shared
// ==================================================================
function closeAll(){
  if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
  if (playingAudio){ playingAudio.pause(); playingAudio = null; }
  document.getElementById("overlay").classList.remove("show");
  document.getElementById("custSheet").classList.remove("show");
  document.getElementById("addSheet").classList.remove("show");
  document.getElementById("padSheet").classList.remove("show");
  document.getElementById("voiceSheet").classList.remove("show");
  document.getElementById("histSheet").classList.remove("show");
}

let toastTimer;
function toast(text, isError){
  const t = document.getElementById("toast");
  t.textContent = text;
  t.className = "toast show" + (isError ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = "toast", 2600);
}
</script>
